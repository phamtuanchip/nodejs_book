# Nginx làm reverse proxy trước Node.js
# Xử lý: load balancing, SSL termination, gzip, rate limiting
# Reload config (không downtime): nginx -s reload

worker_processes auto;   # tự động dùng số CPU

events {
    worker_connections 1024;   # số kết nối đồng thời mỗi worker
}

http {
    # ── MIME types ───────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Log format có request time ───────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Hiệu năng ────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # ── Gzip nén response — giảm bandwidth đáng kể ──────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;       # chỉ nén file >= 1KB
    gzip_comp_level 6;          # mức nén (1=nhanh, 9=nén tốt nhất)
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Rate limiting — chống DDoS và brute force ────────────
    # Tạo zone "api_limit": theo dõi theo IP, lưu 10MB state, max 10 req/s
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── Upstream: danh sách Node.js servers ─────────────────
    # PM2 cluster chạy nhiều process trên nhiều port
    # hoặc nhiều container Docker
    upstream nodejs_servers {
        # Round-robin mặc định — phân tải đều
        server 127.0.0.1:3000;
        # server 127.0.0.1:3001;  # thêm instance khi scale
        # server 127.0.0.1:3002;

        # Keepalive — tái dùng kết nối tới Node.js, giảm overhead TCP
        keepalive 32;
    }

    # ── Server: HTTP (chuyển hướng sang HTTPS) ───────────────
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;

        # Chuyển tất cả HTTP sang HTTPS
        return 301 https://$host$request_uri;

        # Nếu chưa có SSL, comment block trên và dùng location bên dưới
    }

    # ── Server: HTTPS ────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        # ── SSL certificate (Let's Encrypt / Certbot) ────────
        # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Tạm dùng self-signed cert khi test:
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Security headers ─────────────────────────────────
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Proxy tới Node.js ─────────────────────────────────
        location / {
            # Áp dụng rate limit — burst=20 cho phép burst ngắn, nodelay = reject ngay
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://nodejs_servers;
            proxy_http_version 1.1;

            # Headers cần thiết để Node.js biết IP thật của client
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keepalive với upstream
            proxy_set_header Connection "";

            # Timeout
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── Health check endpoint — không rate limit ─────────
        location /health {
            proxy_pass http://nodejs_servers;
            proxy_set_header Host $host;
            access_log off;   # không ghi log health check
        }

        # ── Static files — Nginx phục vụ trực tiếp, không qua Node ─
        location /static/ {
            alias /var/www/myapp/public/;
            expires 30d;      # cache trên browser 30 ngày
            add_header Cache-Control "public, immutable";
        }
    }
}
