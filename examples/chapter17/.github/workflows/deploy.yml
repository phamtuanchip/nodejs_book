name: CI/CD — Build, Test & Deploy

# Trigger: push lên nhánh main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]    # chạy test cho PR nhưng không deploy

env:
  REGISTRY: ghcr.io                               # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}            # username/repo-name

jobs:
  # ── Job 1: Chạy test ────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'            # cache node_modules theo package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  # ── Job 2: Build và push Docker image ───────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test                   # chỉ chạy sau khi test pass
    if: github.ref == 'refs/heads/main'   # chỉ chạy trên nhánh main

    permissions:
      contents: read
      packages: write             # quyền push lên GitHub Container Registry

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token tự động từ GitHub Actions

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag theo git SHA — immutable, dễ rollback
            type=sha,prefix=sha-
            # Tag "latest" trên nhánh main
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build và push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layer từ lần build trước — giảm thời gian build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy lên VPS qua SSH ───────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://yourdomain.com   # hiển thị link trong GitHub UI

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}           # IP hoặc domain VPS
          username: ${{ secrets.VPS_USER }}       # user SSH (ví dụ: deploy)
          key: ${{ secrets.VPS_SSH_KEY }}         # private key SSH (không có passphrase)
          port: ${{ secrets.VPS_PORT || 22 }}

          # Script chạy trên VPS
          script: |
            set -e  # dừng ngay nếu có lệnh lỗi

            cd /var/www/myapp

            # Pull image mới nhất
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Restart container không downtime
            docker compose pull app
            docker compose up -d --no-deps app

            # Xoá image cũ không dùng — giải phóng disk
            docker image prune -f

            echo "Deploy thành công lúc $(date)"
